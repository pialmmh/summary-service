# =====================================================================================
# The tenant registry OF THE JAR. It enables NO tenant.
#
# A jar that is started with no configuration of its own must be nobody's deployment: a registry
# here that enabled one made every such start that tenant's — with that tenant's addresses.
# So a start that names no tenant is REFUSED, in words that say how a deployment names one:
#
#   * the unit names it:      SUMMARY_ACTIVE_TENANT=<tenant>/<profile>   (or -Dsummary.active-tenant=...)
#   * or a FILE names it:     config/tenants.yml with ONE entry `enabled: true`, in the deployment's
#                             configuration directory — the one SUMMARY_CONFIG_DIR (or -Dsummary.config.dir)
#                             names, else the unit's working directory. It is the directory that holds
#                             config/tenants/<tenant>/<profile>/profile-<profile>.yml.
#
# The entries below only LIST the profiles this jar carries (config/tenants/...): a deployment may name
# one of them, or bring its own profile file. The voice deployment's registry file: deploy/tcbl-tenants.yml.example
# =====================================================================================
tenants:
  - name: tcbl
    enabled: false
    profile: dev
  - name: tcbl
    enabled: false
    profile: prod
  # the wifi (ad) tenant: the ad view as a Call, service group 30, PostgreSQL (config/tenants/btcl/lab)
  - name: btcl
    enabled: false
    profile: lab
