# =====================================================================================
# btcl / ad-radius2 — summary-service for the AD CATEGORY ALONE on the radius-2 bed (ARCH-0102 / SS-0009).
#
# The owner's ruling (routesphere docs/architecture/two-db-two-tenant-organisation.md §1, §3, §5, §6): one operator (btcl), several
# service CATEGORIES (ad, wifi; later call, sms); each category has the common Odoo database + catalog but ITS OWN services database for
# the records, and ONE billing-core + ONE summary-service per category. This profile is the ad category's summary-service:
#   - the store is `ad_services` (the bed: PostgreSQL 10.10.188.2:5434), a tier = a schema of it (btcl, res_<n>) as before; it sums
#     what the AD category's billing-core (its profile btcl/ad-radius2) wrote there and reads nothing of another category's database;
#   - kinds = ad ONLY, and the beans: the ad pair (sum_ad_day_30 / sum_ad_hr_30) and the chargeable roll-up (sum_chargeable_day / _hr —
#     a cross-kind reader: it sums the enabled kinds' legs, here group 30's, and starts under any kind: SS-0009 D2). No call-shaped
#     bean of 30 or 101, no WiFi bean: the WiFi pair's summary-service sums the WiFi category in wifi_services;
#   - the category word names this service's consumer groups (summary-service-ad-ping-<uuid>, summary-service-ad-doorbell-<uuid>) so
#     the two summary-services on the bed's one Kafka are told apart; the ping topic is the category's (cdr_summary_ping_ad_btcl, the
#     same name in the ad billing-core's billing.summary.ping-topic); the doorbell is the root's one topic (config_event_loader_btcl);
#   - secrets only by the NAME of an environment variable (secreteer's /etc/secreteer/btcl/summary-service-ad.env through the unit's
#     EnvironmentFile=); never a value here.
# The tree comes from the bed's one prime-context, the facade on :7091. The listener and the zone (Asia/Dhaka) are the unit's java
# line. The keys: docs/ad-as-call/postgres-ad-profile.md (§8: one summary-service per category). profile-radius2.yml is the pre-split
# bed profile; the WiFi pair's profile is the WiFi side's.
# =====================================================================================

summary:
  # ---- the workers, the ping listener and the reaper start with the service (the jar's default is false). The bed's order: the ad
  # billing-core first (it makes summary_affected in ad_services at its first batch), then this service. ----
  autostart: true

  # ---- a BED profile, not a lab: every endpoint below is this box, but the lab belt is off (the brokers advertise 10.10.188.2) ----
  endpoints:
    local-only: false

  # ---- the service CATEGORY (ARCH-0102): names this service's consumer groups. ----
  category: ad

  # ---- the kinds (SS-0008): the AD category alone. A bean below of a kind not named here REFUSES the start; a cdr row of another
  # kind in ad_services (there should be none: the ad billing-core writes such a record to cdrerror, KIND_NOT_ENABLED) is summed by
  # no bean and counted (KIND_NOT_ENABLED, once per tenant, kind and day). ----
  kinds: [ad]

  # ---- the store: the AD category's services database on PostgreSQL; a tier is a SCHEMA of it ----
  store:
    kind: postgresql
    url: jdbc:postgresql://127.0.0.1:5434/ad_services    # pair2's PostgreSQL on this box; the ad category's records
    username: summary_service                            # USAGE + CREATE on each tier schema (prime-context's create-or-adopt)
    password-ref: env:TENANT_BTCL_AD_SUMMARY_SERVICE_PASSWORD   # the NAME of the variable; never the value
    min-size: 0
    max-size: 16

  # ---- the tenants: ONE process serves every tier schema of the root's tree, read from prime-context ----
  tenants:
    mode: tree                                           # single (one schema: the URL's own) | tree
    root: btcl                                           # the root tenant = the root schema; names the doorbell's topic
    prime-context:
      base-url: http://10.10.188.2:7091                  # the bed's one prime-context (the facade)
      # token-ref: env:PRIME_CONTEXT_TOKEN               # HARDEN-2: the NAME of the variable (secreteer) that holds this service's
                                                         # token for prime-context's tree roads; set it, with the variable, before
                                                         # prime-context's guard is flipped to bearer. Not set: no bearer, as before
    doorbell:
      topic-base: config_event_loader                    # -> config_event_loader_btcl: prime-context rings ONE topic per root
      bootstrap-servers: 10.10.188.2:9092                # kafka-s2, the bed's one cluster
    reload-debounce-ms: 1000                             # several rings in a burst are ONE read of the tree
    refresh-seconds: 300                                 # the tree is read even when no ring came

  # ---- the beans of the AD category (the brief's item 3: the sum_ad_* and sum_chargeable_* beans only) ----
  #   the AD pair         : sum_ad_day_30 / sum_ad_hr_30 — by tenant, payer, campaign, rule, zone, site, app, media kind, outcome
  #                         (summarybeans/ad).
  #   the CHARGEABLE pair : sum_chargeable_day / sum_chargeable_hr — every chargeable leg of the ENABLED kinds' groups (30 here), as
  #                         it is (summarybeans/call/chargeable; a cross-kind reader, admitted under any enabled kind: SS-0009 D2).
  # All four read the cdr entity's outbox rows, each from its own bookmark; the reaper trims the cdr entity by their minimum.
  enabledSummary:
    - dailyAdSummary                             # -> summarybeans/ad/DailyAdSummary.java   (sum_ad_day_30)
    - hourlyAdSummary                            # -> summarybeans/ad/HourlyAdSummary.java  (sum_ad_hr_30)
    - dailyChargeableSummary                     # -> summarybeans/call/chargeable/DailyChargeableSummary.java  (sum_chargeable_day)
    - hourlyChargeableSummary                    # -> summarybeans/call/chargeable/HourlyChargeableSummary.java (sum_chargeable_hr)

  # ---- the outbox ----
  outbox:
    ping-topic: cdr_summary_ping_ad_btcl         # the AD category's ping (billing-core's billing.summary.ping-topic, the same name);
                                                 # the topic carries the ROOT and the CATEGORY, and it must exist
    ping-bootstrap-servers: 10.10.188.2:9092     # kafka-s2, the bed's one cluster
    poll-interval-seconds: 5                     # the fallback drain when no ping arrives
    max-rows-per-tx: 1                           # 1 outbox row = 1 billing batch per drain transaction
    segment-size: 1000
    reaper-interval-seconds: 60
    quarantine-after: 8
